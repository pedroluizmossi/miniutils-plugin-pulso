# Plugin de exemplo com os recursos avançados: provedores do hub (uses), dados guardados,
# rede com lista de domínios, tela em vários arquivos com imagem própria e fatos para a
# conversa entre mascotes. Funciona no Linux e no Windows.
# Formato: https://github.com/pedroluizmossi/hub-app-rust (src/core/plugins.rs e src/apps/plugin.rs).
id = "io.github.pedroluizmossi.pulso"
name = "Pulso"
description = "CPU ao vivo com gráfico, recorde guardado, o processo culpado nos picos e o IP público. Linux e Windows. Plugin de exemplo dos recursos avançados."
icon = "coelho"
api = 1
# as leituras de CPU, temperatura e memória chegam em fn on_event("sys", dados); os
# processos mais pesados (o culpado de um pico), em fn on_event("procs", dados)
uses = ["sys", "procs"]

[permissions]
# o IP público (http_get_async)
net = ["api.ipify.org"]

[ui]
view = "view.slint"
script = "main.rhai"
# o tick só reconsulta o IP público
every = 600

[[settings]]
key = "limite"
label = "Pico de CPU a partir de (%)"
type = "int"
default = 85
min = 50
max = 100
step = 5

[[settings]]
key = "ip"
label = "Mostrar o IP público (consulta api.ipify.org)"
type = "bool"
default = true
